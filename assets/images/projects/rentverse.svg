<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="RentVerse University Property and Asset Management preview">
  <defs>
    <linearGradient id="rv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#062E39"/>
    </linearGradient>
    <linearGradient id="rv-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="rv-glow" cx="25%" cy="78%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="340" fill="url(#rv-bg)"/>
  <rect width="600" height="340" fill="url(#rv-glow)"/>

  <!-- App Container -->
  <rect x="30" y="24" width="540" height="292" rx="14" fill="#0B1120" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Bar -->
  <rect x="30" y="24" width="540" height="44" rx="14" fill="#111C33"/>
  <rect x="30" y="54" width="540" height="14" fill="#111C33"/>
  <line x1="30" y1="68" x2="570" y2="68" stroke="#1E293B"/>

  <rect x="48" y="36" width="22" height="22" rx="6" fill="url(#rv-accent)"/>
  <path d="M54 48 L59 42 L64 48 V53 H54 Z" fill="#FFFFFF"/>
  <text x="78" y="51" font-family="Space Grotesk, sans-serif" font-size="11.5" font-weight="700" fill="#F8FAFC">RentVerse</text>

  <!-- Search Pill -->
  <rect x="172" y="36" width="230" height="22" rx="11" fill="#070B14" stroke="#1E293B"/>
  <text x="188" y="50" font-family="Inter, sans-serif" font-size="8" fill="#64748B">Search Ashulia / DIU student housing...</text>
  <rect x="466" y="36" width="86" height="22" rx="11" fill="#0891B2" fill-opacity="0.22" stroke="#22D3EE" stroke-opacity="0.45"/>
  <text x="509" y="50" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#67E8F9" text-anchor="middle">Filter Grid</text>

  <!-- Property Card 1 -->
  <rect x="48" y="84" width="160" height="214" rx="10" fill="#141F35" stroke="#1E293B"/>
  <rect x="56" y="92" width="144" height="82" rx="7" fill="#164E63" fill-opacity="0.45"/>
  <path d="M98 145 L128 118 L158 145 V164 H98 Z" fill="#22D3EE" fill-opacity="0.35" stroke="#67E8F9" stroke-width="1.2"/>
  <rect x="64" y="100" width="58" height="16" rx="8" fill="#064E3B"/>
  <text x="93" y="111" font-family="Inter, sans-serif" font-size="7.5" font-weight="700" fill="#6EE7B7" text-anchor="middle">Verified</text>
  <text x="60" y="192" font-family="Space Grotesk, sans-serif" font-size="10.5" font-weight="700" fill="#F8FAFC">Campus Residence A2</text>
  <text x="60" y="207" font-family="Inter, sans-serif" font-size="8" fill="#94A3B8">0.4 km from DIU Gate</text>
  <rect x="60" y="220" width="46" height="14" rx="5" fill="#1E293B"/>
  <text x="83" y="230" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1" text-anchor="middle">WiFi</text>
  <rect x="112" y="220" width="58" height="14" rx="5" fill="#1E293B"/>
  <text x="141" y="230" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1" text-anchor="middle">Furnished</text>
  <text x="60" y="262" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700" fill="#67E8F9">BDT 8,500/mo</text>
  <rect x="60" y="272" width="136" height="18" rx="5" fill="#2563EB"/>
  <text x="128" y="284" font-family="Inter, sans-serif" font-size="7.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Inspect Details</text>

  <!-- Property Card 2 -->
  <rect x="220" y="84" width="160" height="214" rx="10" fill="#141F35" stroke="#22D3EE" stroke-opacity="0.4"/>
  <rect x="228" y="92" width="144" height="82" rx="7" fill="#1E3A8A" fill-opacity="0.4"/>
  <rect x="266" y="114" width="68" height="44" rx="4" fill="#3B82F6" fill-opacity="0.35" stroke="#60A5FA" stroke-width="1.2"/>
  <rect x="236" y="100" width="66" height="16" rx="8" fill="#1E3A8A"/>
  <text x="269" y="111" font-family="Inter, sans-serif" font-size="7.5" font-weight="700" fill="#93C5FD" text-anchor="middle">Shared Suite</text>
  <text x="232" y="192" font-family="Space Grotesk, sans-serif" font-size="10.5" font-weight="700" fill="#F8FAFC">Scholars Hostel Hub</text>
  <text x="232" y="207" font-family="Inter, sans-serif" font-size="8" fill="#94A3B8">Ashulia Academic Zone</text>
  <rect x="232" y="220" width="56" height="14" rx="5" fill="#1E293B"/>
  <text x="260" y="230" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1" text-anchor="middle">24/7 Power</text>
  <rect x="294" y="220" width="52" height="14" rx="5" fill="#1E293B"/>
  <text x="320" y="230" font-family="Inter, sans-serif" font-size="7" fill="#CBD5E1" text-anchor="middle">Security</text>
  <text x="232" y="262" font-family="Space Grotesk, sans-serif" font-size="12" font-weight="700" fill="#67E8F9">BDT 5,200/mo</text>
  <rect x="232" y="272" width="136" height="18" rx="5" fill="#0891B2"/>
  <text x="300" y="284" font-family="Inter, sans-serif" font-size="7.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Book Inquiry</text>

  <!-- Right Campus Map & Asset Tracker Panel -->
  <rect x="392" y="84" width="160" height="214" rx="10" fill="#0F172A" stroke="#1E293B"/>
  <text x="406" y="106" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" fill="#94A3B8">CAMPUS MAP GRID</text>
  <!-- Map Grid Lines -->
  <rect x="404" y="116" width="136" height="106" rx="8" fill="#111C33" stroke="#1E293B"/>
  <line x1="404" y1="150" x2="540" y2="150" stroke="#1E293B"/>
  <line x1="404" y1="186" x2="540" y2="186" stroke="#1E293B"/>
  <line x1="450" y1="116" x2="450" y2="222" stroke="#1E293B"/>
  <line x1="496" y1="116" x2="496" y2="222" stroke="#1E293B"/>
  <!-- Pins -->
  <circle cx="442" cy="144" r="6" fill="#22D3EE"/>
  <circle cx="442" cy="144" r="11" fill="#22D3EE" fill-opacity="0.22"/>
  <circle cx="502" cy="176" r="6" fill="#3B82F6"/>
  <circle cx="502" cy="176" r="11" fill="#3B82F6" fill-opacity="0.22"/>
  <!-- Asset Metrics -->
  <rect x="404" y="232" width="136" height="54" rx="8" fill="#141F35" stroke="#1E293B"/>
  <text x="416" y="251" font-family="Inter, sans-serif" font-size="7.5" font-weight="600" fill="#94A3B8">ACTIVE ASSETS</text>
  <text x="416" y="272" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#34D399">24 Listings</text>
</svg>
